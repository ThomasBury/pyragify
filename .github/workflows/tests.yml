name: testing

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
permissions:
  contents: read

jobs:
  uv-example:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --locked --python 3.12 --group dev

      - name: Run tests
        run: uv run --locked pytest tests

      - name: Verify bundled skill packaging and installation
        run: uv run --locked python scripts/check_skill_packaging.py

  windows-export:
    name: Windows export and rerun
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --locked --python 3.12 --group dev

      - name: Test export reruns and junction handling
        run: >-
          uv run --locked pytest
          tests/test_handoff.py::test_export_rerun_removes_owned_legacy_text_parts
          tests/test_export_safety.py::test_junction_cannot_redirect_legacy_artifact_cleanup
